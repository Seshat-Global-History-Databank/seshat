{% load leaflet_tags %}

<head>
    {% leaflet_js %}
    {% leaflet_css %}
    {% load static %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>

<style>
    input {
        accent-color: teal;
    }

    #controls-and-maps {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #playButtons {
        text-align: center;
        display: flex;
        justify-content: space-between;
    }

    #globeButtonDiv {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #polityMapAndGlobe {
        position: relative;
        height: 55vh;
        width: 50%;
        overflow: hidden; /* Ensure child elements do not overflow */
    }

    #map {
        height: 100%;
        width: 100%;
        z-index: 0;
        position: relative;
    }
    #globeParent {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        flex: 1;
        display: none;
    }
    #globe {
        position: absolute;
        width: 100%;
        height: 55vh;
    }
    body, html {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }
    #componentLegend {
        position: absolute;
        top: 50%;
        right: 1%;
        transform: translateY(-50%);
        background-color: rgba(255, 253, 242, 1);
        padding: 10px;
        border-radius: 5px;
        width: 200px;
        max-width: 50%;
        max-height: 60%;
        overflow-y: auto;
        z-index: 999;
    }
    #componentLegendGlobe {
        position: absolute;
        top: 50%;
        left: 1%;
        transform: translateY(-50%);
        background-color: rgba(255, 253, 242, 1);
        padding: 10px;
        border-radius: 5px;
        width: 200px;
        max-width: 50%;
        max-height: 60%;
        overflow-y: auto;
        z-index: 999;
    }
    .display-info-container {
        position: relative;
        display: inline-block;
        cursor: pointer;
    }
    
    .display-info-container::after {
        content: "Include the borders of polities that are linked to the selected polity via suprapolity relations.";
        visibility: hidden;
        width: 200px;
        background-color: #782823;
        color: #fff;
        border-radius: 5px;
        padding: 10px;
        position: absolute;
        z-index: 9999;
        top: 50%;
        /* right: 125%; */
        margin-top: -20px;
        opacity: 0;
        transition: opacity 0.3s;
    }
    
    .display-info-container:hover::after {
        visibility: visible;
        opacity: 1;
    }

    .settings {
        display: none;
        position: relative;
        z-index: 999;
        max-height: 100%; /* Ensure it doesn't exceed the parent div height */
        height: auto;
        overflow-y: auto; /* Add vertical scroll if content overflows */
        margin-top: 10px;
        background-color: rgba(255, 253, 242, 1);
        border-color: rgba(255, 253, 242, 1);
        border-radius: 5px;
        border-style: solid;
        border-width: 4px;
        padding: 10px;
    }

    .help {
        display: none;
    }

</style>

<body>
    {% block content %}
    {% if content.include_polity_map %}
        <h2 class="h2 text-dark federicka-medium">
            <span>Displayed: </span>
            <span id="sliderDate"></span>
        </h2>
        <div id="controls-and-maps">
            <div id="polityMapAndGlobe">
                <div id="map">
                    <div id="componentLegend"></div>
                </div>
                <div id="globeParent">
                    <div id="globe"></div>
                    <div id="componentLegendGlobe"></div>
                </div>
            </div>
            <div class="settings" id="settings">
                <div id="globeButtonDiv">
                    <button class="friendly-button-big" id="globeButton" type="button" onclick="pressGlobeButton()">🌍</button>
                </div><br><br>
                <fieldset>
                    <label for="baseMap">Map:</label>
                    <select name="baseMap" id="baseMap" onchange="switchBaseMap()">
                        <option value="arcgis" selected>Satellite (Esri World Imagery)</option>
                        <option value="cesium">Globe (Cesium)</option>
                        <option value="osm">Street Maps (OSM)</option>
                        <option value="carto">Basic unlabelled (CARTO)</option>
                        <option value="gadm" disabled>Clickable borders (GADM)</option>
                    </select><br>
                </fieldset>
                <fieldset id="baseMapGADMFieldset">
                    <label for="baseMapGADM">Current borders:</label>
                    <select name="baseMapGADM" id="baseMapGADM" onchange="switchBaseMap()">
                        <option value="country">Countries</option>
                        <option value="province">Provinces</option>
                    </select><br>
                    <label for="baseMapOnly">Base map only</label>
                    <input type="checkbox" id="baseMapOnly" name="baseMapOnly" onclick=plotPolities()><br>
                </fieldset>
                <fieldset>
                    <fieldset id="supraPolityRelationsFieldset" style="display: block">
                        <div id="supraPolityRelationsDiv" style="display: none;">
                            <label for="supraPolityRelations">Suprapolity Relations</label>
                            <input type="checkbox" id="supraPolityRelations" name="supraPolityRelations" onclick="plotPolities();">
                            <div class="display-info-container">
                                ℹ️
                            </div>
                        </div><br><br>
                    </fieldset>
                    <label for="opacitySlide">Opacity:</label>
                    <input type="range" name="opacitySlide" id="opacitySlide" min="0.1" max="1" step="0.1" value="0.7"
                        class="slider" onchange="plotPolities()"><br><br>
                    <label for="enterYear">Year:</label>
                    <input type="number" id="enterYear" name="enterYear" value="{{ content.display_year }}" style="width: 75px;">
                    <p style="display: inline; margin-left: 5px;">🗣️ <i>Hit enter.</i></p><br>
                    <label for="increment">Play rate:</label>
                    <input type="number" id="increment" name="increment" value="10" style="width: 50px;" onchange="playRateValue()">
                    <p style="display: inline; margin-left: 5px; width: 250px;">🗣️ <i>Hit enter.</i></p><br><br>
                </fieldset>
                <div id="playButtons">
                    <button class="friendly-button-small" id="startButton" type="button" onclick="adjustSliderStartYear()">⏮️</button>
                    <button class="friendly-button-small" id="minusButton" type="button" onclick="adjustSliderDown()">⏪</button>
                    <button class="friendly-button-small" id="playButton" type="button" onclick="playBack()">▶️</button>
                    <button class="friendly-button-small" id="plusButton" type="button" onclick="adjustSliderUp()">⏩</button>
                    <button class="friendly-button-small" id="endButton" type="button" onclick="adjustSliderEndYear()">⏭️</button>
                </div>
                <p>
                    <b><a href="../cliopatria" target="_blank">Polity border choices.</a></b>
                </p>
            </div>
            <div id="help"></div>
        </div>
        <div class="slider-container" style="position: relative; padding-bottom: 20px;">
            <datalist id="yearTickmarks"></datalist>
            <input type="range" name="dateSlide" id="dateSlide" min="{{ content.earliest_year }}"
                max="{{ content.latest_year }}" value="{{ content.display_year }}" class="slider" onchange="plotPolities()"
                style="width: 100%;" list="yearTickmarks">
            <div id="yearTickmarkValues"></div><br>
        </div>
        <script src="{% static 'core/js/map_functions.js' %}?v={{ version }}"></script>
        <script>

            toggleSettings(worldMap=false);

            // Allows scrolling on the componentLegend div
            const componentLegend = document.getElementById('componentLegend');
            componentLegend.addEventListener('wheel', function (event) {
                event.stopPropagation();
            });

            window.onload = setSliderTicks({{ content.tick_years }}, worldMap = false);

            var allPolitiesLoaded = false;

            var displayedShapes = [];
            // Load inital polity shapes for the displayed year
            var polityMapShapesData = [
                // JavaScript object representing shape data
                {% for shape in content.shapes %}
                    {
                        {% for key, value in shape.items %}
                            '{{ key }}': '{{ value|escapejs }}',
                        {% endfor %}
                        'suprapolity_relation_shape': false,
                        'other_polity_is_child': false,
                    },
                {% endfor %}
            ];

            allPolitiesLoaded = true;

            // Load capital info
            var capitalsInfo = {{ content.capitals_info | safe }};

            // Load suprapolity relations
            var supraPolityRelationData = [
                {% for relation in content.suprapolity_relations %}
                    {
                        'polity_id': '{{ relation.polity_id }}',
                        'other_polity_id': '{{ relation.other_polity_id }}',
                        'suprapolity_relations': '{{ relation.suprapolity_relations }}',
                        'other_polity_is_child': {{ relation.other_polity_is_child | lower }},
                        'shapes': [
                            {% for shape in relation.shapes %}
                                {
                                    {% for key, value in shape.items %}
                                        '{{ key }}': '{{ value|escapejs }}',
                                    {% endfor %}
                                    'suprapolity_relation_shape': true,
                                    'other_polity_is_child': {{ relation.other_polity_is_child | lower }},
                                },
                            {% endfor %}
                        ]
                    },
                {% endfor %}
            ];

            var supraPolityRelationsCheckbox = document.getElementById('supraPolityRelations');
            var supraPolityRelationDiv = document.getElementById('supraPolityRelationsDiv');
            // If any suprapolity relations exist, enable the checkbox div
            if (supraPolityRelationData.length > 0) {
                supraPolityRelationDiv.style.display = 'block';
            }

            // If any of the relationships are child relationships, check the checkbox
            if (supraPolityRelationData.some(relation => relation.other_polity_is_child === true)) {
                supraPolityRelationsCheckbox.checked = true;
            }

            var seshat_id_page_id = {{ content.seshat_id_page_id | safe }};
            var relations_seshat_id_page_id = {{ content.relations_seshat_id_page_id | safe }};

            var provinceShapeData;
            var countryShapeData;

            // Load all polity shapes and modern province/country shapes in background
            window.addEventListener('load', function () {
                fetch('/core/provinces_and_countries')
                    .then(response => response.json())
                    .then(data => {
                        provinceShapeData = data.provinces.map(function (shape) {
                            return {
                                geometry: JSON.parse(shape.aggregated_geometry),
                                country: shape.country,
                                province: shape.province,
                                provinceType: shape.province_type
                            };
                        });

                        countryShapeData = data.countries.map(function (shape) {
                            return {
                                geometry: JSON.parse(shape.aggregated_geometry),
                                country: shape.country
                            };
                        });

                        document.getElementById('baseMap').options[4].disabled = false;
                    });
            });

            // Create the map
            var map = createMap();

            // Set the initial map zoom level to fit everything in polityMapShapesData
            var fullGeojsonData = polityMapShapesData.map(function (shape) {
                return JSON.parse(shape.geom_json);
            });
            map.fitBounds(L.geoJSON(fullGeojsonData).getBounds());

            var accessToken = "{{ content.CESIUM_ION_ACCESS_TOKEN }}";
            var viewer = createGlobe(accessToken);

            var baseLayers = createBaseLayers();

            // Select arcgis (Esri) as the default base layer
            var currentLayer = baseLayers.arcgis.addTo(map);
            var provinceLayers = []; // Keep track of province layers to remove them later

            // Set the default base map to Esri World Imagery
            switchBaseMap();

            function plotPolities() {  // This function is defined differently in the world_map template

                var selectedYear = document.getElementById('dateSlide').value;
                var opacity = document.getElementById('opacitySlide').value;
                var selectedMap = document.getElementById("baseMap").value;
                var supraPolityRelations = document.getElementById('supraPolityRelations').checked;

                // Remove all existing data sources from the viewer
                viewer.dataSources.removeAll();

                // Remove all existing layers from the map
                map.eachLayer(function (layer) {
                    if (layer instanceof L.GeoJSON || layer instanceof L.MarkerClusterGroup || layer instanceof L.CircleMarker) {
                        map.removeLayer(layer);
                    }
                });

                // Hide the viewer or map div depending on the selected base map
                if (selectedMap !== 'cesium') {
                    document.getElementById('globeParent').style.display = 'none';
                    document.getElementById('map').style.display = 'block';
                } else {
                    document.getElementById('map').style.display = 'none';
                    document.getElementById('globeParent').style.display = 'block';
                }

                // Convert to int, because for some reason JS converts it to a string
                var selectedYearInteger = parseInt(selectedYear);

                var toDisplayShapesData = polityMapShapesData.slice();
                // If suprapolity relations are enabled add the relation shapes to toDisplayShapesData
                if (supraPolityRelations) {
                    supraPolityRelationData.forEach(function (relationData) {
                        relationData['shapes'].forEach(function (shape) {
                            toDisplayShapesData.push(shape);
                        });
                    });
                }

                // Add shapes to the map
                // Don't plot them if "Base map only" checkbox selected
                if (!document.getElementById('baseMapOnly').checked) {
                    toDisplayShapesData.forEach(function (shape) {

                        // If the shape spans the selected year and is a component (does not have its own components)
                        if ((parseInt(shape.start_year) <= selectedYearInteger && parseInt(shape.end_year) >= selectedYearInteger) && shouldDisplayShapePolityPage(shape)) {

                            var shouldPlot = true;
                            // If the shape has supra_polity_relations, the range from relation_start_year to relation_end_year must also span the selected year
                            if (shape.supra_polity_relations !== undefined) {
                                if ((parseInt(shape.relation_start_year) <= selectedYearInteger && parseInt(shape.relation_end_year) >= selectedYearInteger)) {
                                    shouldPlot = true;
                                } else {
                                    shouldPlot = false;
                                }
                            }

                            if (shouldPlot){

                                // Format the area float
                                const formattedArea = parseFloat(shape.area).toLocaleString('en-US', {
                                    minimumFractionDigits: 0,
                                    maximumFractionDigits: 0,
                                    useGrouping: true
                                });

                                // Format the years
                                if (parseInt(shape.polity_start_year) < 0) {
                                    displaystart_year = Math.abs(parseInt(shape.polity_start_year)) + ' BCE';
                                } else {
                                    displaystart_year = shape.polity_start_year + ' CE';
                                }

                                if (parseInt(shape.polity_end_year) < 0) {
                                    displayend_year = Math.abs(parseInt(shape.polity_end_year)) + ' BCE';
                                } else {
                                    displayend_year = shape.polity_end_year + ' CE';
                                }

                                if (parseInt(shape.start_year) < 0) {
                                    shapestart_year = Math.abs(parseInt(shape.start_year)) + ' BCE';
                                } else {
                                    shapestart_year = shape.start_year + ' CE';
                                }

                                if (parseInt(shape.end_year) < 0) {
                                    shapeend_year = Math.abs(parseInt(shape.end_year)) + ' BCE';
                                } else {
                                    shapeend_year = shape.end_year + ' CE';
                                }

                                let wiki_page = 'https://en.wikipedia.org/wiki/' + shape.wikipedia_name.replace(/ /g, '_');
                                var popupContent = `
                                    <table>
                                        <tr>
                                            <th>${shape.name}</th>
                                            <th></th>
                                        </tr>
                                `;
                                function seshatPageLink(shape, seshatData, selectedMap) {
                                    var polityId = seshatData[shape.seshat_id]['id'];
                                    var longName = seshatData[shape.seshat_id]['long_name'];
                                    if (longName == '') {
                                        longName = '[Page empty]';
                                    }
                                    if (selectedMap == 'cesium') {
                                        return `
                                            <tr>
                                                <td>Seshat page</td>
                                                <td>${longName} (${shape.seshat_id})</td>
                                            </tr>
                                        `;
                                    } else {
                                        return `
                                            <tr>
                                                <td>Seshat page</td>
                                                <td><a href="/core/polity/${polityId}" target="_blank">${longName} (${shape.seshat_id})</a></td>
                                            </tr>
                                        `;
                                    }
                                }

                                if (shape.seshat_id in seshat_id_page_id) {
                                    popupContent += seshatPageLink(shape, seshat_id_page_id, selectedMap);
                                }
                                if (shape.seshat_id in relations_seshat_id_page_id) {
                                    popupContent += seshatPageLink(shape, relations_seshat_id_page_id, selectedMap);
                                }

                                if (supraPolityRelations && shape.supra_polity_relations !== undefined) {
                                    popupContent = popupContent + `
                                        <tr>
                                            <td>Suprapolity relation</td>
                                            <td style="text-transform: capitalize;">${shape.supra_polity_relations}</td>
                                        </tr>
                                    `;
                                }

                                var popupContent = popupContent + `
                                        <tr>
                                            <td>Wikipedia page</td>
                                            <td><a href="${wiki_page}" target="_blank">${shape.wikipedia_name}</a></td>
                                        </tr>
                                        <tr>
                                            <td>Duration</td>
                                            <td>${displaystart_year} to ${displayend_year}</td>
                                        </tr>
                                        <tr>
                                            <td>Area (est.)</td>
                                            <td>${formattedArea} Km<sup>2</sup></td>
                                        </tr>
                                        <tr>
                                            <td>Shapefile ID</td>
                                            <td>${parseInt(shape.id).toLocaleString()}</td>
                                        </tr>
                                        <tr>
                                            <td>Shapefile years</td>
                                            <td>${shapestart_year} to ${shapeend_year}</td>
                                        </tr>
                                    </table>
                                `;

                                if (selectedMap === 'cesium') {

                                    // Parse the GeoJSON data
                                    var geoJsonData = JSON.parse(shape.geom_json);

                                    // Load the GeoJSON data
                                    Cesium.GeoJsonDataSource.load(geoJsonData, {
                                        stroke: Cesium.Color.fromCssColorString(shape.colour),
                                        fill: Cesium.Color.fromCssColorString(shape.colour).withAlpha(opacity),
                                        strokeWidth: 2
                                    }).then(function (dataSource) {
                                        // Add the data source to the viewer
                                        viewer.dataSources.add(dataSource);
                                    
                                        // Bind popups to the features
                                        dataSource.entities.values.forEach(function (entity) {                   
                                            entity.description = new Cesium.ConstantProperty(popupContent);
                                        });

                                        // Update the displayedShapes array
                                        if (displayedShapes.indexOf(shape.name) === -1) {
                                            displayedShapes.push(shape.name);
                                        }

                                        // Adjust the viewer so we get a nice spin of the globe
                                        viewer.flyTo(dataSource, {
                                            offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), viewer.camera.positionCartographic.height)
                                        });

                                    }).catch(function (error) {
                                        console.error('Error loading GeoJSON data: ', error);
                                    });

                                } else {

                                    // Add shape
                                    var geoJSONLayer = L.geoJSON(JSON.parse(shape.geom_json), {
                                        style: function (feature) {
                                            return {
                                                fillColor: shape.colour,  // Set the fill color based on the "colour" field
                                                color: shape.colour,     // Set the border color
                                                weight: 2,              // Set the border weight
                                                fillOpacity: opacity   // Set the fill opacity
                                            };
                                        },
                                        onEachFeature: function (feature, layer) {
                                            layer.bindPopup(popupContent);
                                        }
                                    }).addTo(map);

                                    // Plot capital markers       
                                    var markers = L.markerClusterGroup({
                                        iconCreateFunction: function(cluster) {
                                            return L.divIcon({
                                                html: '<div style="background-color:' + shape.colour + '; color: #fff; border-radius: 50%; text-align: center; line-height: 40px;"><b>' + cluster.getChildCount() + '</b></div>',
                                                className: 'myClusterIcon',
                                                iconSize: L.point(40, 40)
                                            });
                                        }
                                    });
                                    capitalsInfo.forEach(function (capital) {
                                        // If the capital existed in the selected year (or years not specified)
                                        if ((capital['year_from'] <= selectedYearInteger && capital['year_to'] >= selectedYearInteger)) {
                                            var marker = L.circleMarker([capital.latitude, capital.longitude], {
                                                color: 'black', // Set the border color
                                                fillColor: shape.colour,  // Set the fill color based on the "colour" field
                                                weight: 2,  // Set the border weight
                                                fillOpacity: 0.5,  // Set the fill opacity
                                                radius: 5
                                            });
                                            marker.bindTooltip(capital.capital, {
                                                permanent: true,
                                                direction: "top",
                                                offset: L.point({ x: 0, y: 0 })
                                            });

                                            marker.bindPopup(capital.capital);
                                            markers.addLayer(marker); // add each marker to the MarkerClusterGroup
                                        };
                                    });

                                    map.addLayer(markers); // add the MarkerClusterGroup to the map

                                    // Update the displayedShapes array
                                    if (displayedShapes.indexOf(shape.name) === -1) {
                                        displayedShapes.push(shape.name);
                                    }

                                }
                            }
                        }
                    });

                };
                updateComponentLegend();
            }

            // Initial plot on page load
            plotPolities()

            // Display slider value
            var slider = document.getElementById("dateSlide");
            var enterYearInput = document.getElementById("enterYear");
            var sliderDate = document.getElementById("sliderDate");
            var sliderDate2 = document.getElementById("sliderDate2");  // This is undefined in the polity_map template, but is set to not break updateSliderOutput() in map_functions.js
            updateSliderOutput(); // Display the default slider value

            // Update the current slider value (each time you drag the slider handle)
            slider.oninput = function () {
                updateSliderOutput();
                // Sync enterYear input with dateSlide value
                enterYearInput.value = slider.value;
            }

            var playInterval;

            // Add event listener to stop playing when adjusting the slider manually
            slider.addEventListener("input", stopPlay);

            // Make sure Radio selection is kept on page refresh
            document.addEventListener("DOMContentLoaded", function () {
                // Get the country parameter from the URL
                var urlParams = new URLSearchParams(window.location.search);

                // Trigger filtering when the page refreshes
                plotPolities();

            });

            // Update the enterYear input value when the user hits return
            enterYearInput.addEventListener("keyup", function (event) {
                if (event.key === "Enter") {
                    // Update the slider value
                    slider.value = enterYearInput.value;
                    updateSliderOutput();
                    plotPolities();
                }
            });

        </script>
    {% endif %}
    {% endblock %}
</body>
