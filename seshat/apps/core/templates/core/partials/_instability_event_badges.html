<small style="vertical-align: center;">
    {% if event.is_llm_source %}
        {% if event.batch_number %}
            <span
                style="padding-bottom:0px; padding-left:5px; padding-right:5px; padding-top:1px; border-radius:5px; color:white;{% if event.batch_number == 'Batch 1' %} background:#D3D3D3;{% elif event.batch_number == 'Batch 2' %} background:#ADD8E6;{% elif event.batch_number == 'Batch 3' %} background:#a8dcab;{% else %} background:#d9b26f;{% endif %}"
                data-bs-toggle="tooltip"
                data-bs-html="true"
                title="{{ event.batch_tooltip }}"
            >
                {{ event.batch_number }}
            </span>
        {% endif %}
    {% else %}
        <span
            style="padding-bottom:0px; padding-left:5px; padding-right:5px; padding-top:1px; background:#ead9bd; border-radius:5px; color:#7a5a26;"
            data-bs-toggle="tooltip"
            data-bs-html="true"
            title="Created manually."
        >
            Manual
        </span>
    {% endif %}
</small>
<small style="vertical-align: center; display:inline-block;">
    {% if event.is_llm_source %}
        <a data-bs-toggle="tooltip" data-bs-html="true" class="fw-light text-teal" title="Generated using LLMs.">
            <span class="text-secondary border border-1 rounded border-secondary" style="padding-top:2px; padding-bottom:0px; padding-left:3px; padding-right:3px;">AI</span>
        </a>
    {% endif %}

    {% if event.researchers_list %}
        <a data-bs-toggle="tooltip" data-bs-html="true" title="Checked By: {{ event.researchers_list }}">
            <i class="fa-solid fa-user-tie fa-lg" style="color: #138086" aria-hidden="true"></i>
        </a>
    {% endif %}

    {% if event.comment %}
        <a data-bs-toggle="tooltip" data-bs-html="true" class="fw-normal text-teal" title="Seshat-approved Description added.">
            <span class="text-success border border-1 rounded border-success" style="padding-top:2px; padding-bottom:0px; padding-left:3px; padding-right:3px;">D</span>
        </a>
    {% endif %}

    {% if event.seshat_experts_list %}
        <a data-bs-toggle="tooltip" data-bs-html="true" title="Expert Reviewed By: {{ event.seshat_experts_list }}">
            <span>
                <i class="fa-solid fa-user-graduate fa-lg" style="color: #843b62" aria-hidden="true"></i>
            </span>
        </a>
    {% endif %}
</small>
